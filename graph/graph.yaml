graph:
  fixed: [system, tool_schemas, task, skill]    # components every request re-sends (the fixed prefix of the mechanism equation)
  context: {"context:history": history, "context:task": task, "context:system": system, "context:tool_schemas": tool_schemas}   # context components of the allocation -> short names
  classify:              # component of a tool call (graph/episode.py classify)
    action: '^(update|cancel|book|exchange|return|modify|transfer|refuel|enable|disable|send_(?!message)|create|delete|reset|pay|add|remove|set)'
    lookup: '^(get|find|search|list|check|lookup)'
    bash_read: [cat, head, tail, grep, rg, ls, find, wc, less, file, stat, which, sed, awk, tree, du, df, env, pwd, echo, printf, diff]
    bash_write: [tee, mv, cp, rm, mkdir, touch, chmod, ln, git, apt-get, apt, pip, pip3, npm, make, curl, wget]
    test: 'pytest|unittest|\btest(s)?\b|cargo test|go test|npm test|make check'
    py_state: '\.(post|put|patch|delete)\(|\b(send|create|update|delete|insert)_\w+'
    ext: {code: "py js ts c h cpp rs go java sh rb", doc: "md txt rst html pdf", data: "json csv yaml yml xml tsv jsonl toml", log: "log out err"}
    vocab: [KB_search, lookup, discover, act, msg, conv, bash.read, bash.write, bash.test, bash.other,
            read.code, read.doc, read.data, read.log, read.other, grep, glob, edit, write, todo, other, multi]
    sink: [act, msg, write, edit, bash.write]   # components that change state
  allocate:
    chars_per_token: 4.0 # request tokens -> prompt components (graph/allocate.py)
  costmodel:             # behavior classes and the cost table (graph/costmodel.py)
    min_share: 0.005     # classes below this share of the input tokens are left out of the table ...
    min_price: 0.001     # ... unless stopping the class prices at least this (log units; chosen)
    report_rows: 10      # rows of the table shown to the model
    examples: 3          # argument snippets per class
    readout_classes: 3   # classes named in an episode's GRAPH line
    prefix: [system, tool_schemas, task, skill]   # components every turn re-sends
